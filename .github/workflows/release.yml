name: Release

# On a push to main: with pending changesets, open or update the "Version packages" pull request;
# with none (once it is merged), publish to npm what npm doesn't have yet, with its tag and GitHub
# release. Started by hand (Actions, Release, Run workflow, or `gh workflow run release.yml --ref
# <branch>`), it is a dry run of that branch: in place of the release job, a job with read
# permissions versions the package without pushing and packs it without publishing. A dry run
# publishes nothing, pushes nothing, and opens no pull request, tag or release. RELEASING.md says
# what each step does, and what to do when one fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A push's run that is waiting is replaced by a newer push's run, so
# RELEASING.md asks for nothing to merge right after the version pull request. A dry run only reads,
# so it has a group of its own: started on main, it never replaces a push's waiting run, nor waits
# for one.
concurrency: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}

# Each job asks for what it needs: only the release job can write, or publish.
permissions: {}

jobs:
  # The checks on what npm gets, on the commit the release job versions or publishes, with read
  # permissions only: the build and the tests run the dependencies' code, which never sees the
  # release job's tokens.
  validate:
    name: Validate the package
    if: github.repository == 'dgesteves/signoff-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Bundle size, against each import's budget
        run: pnpm size

      - name: Typecheck the library
        run: pnpm --filter signoff-ui typecheck

      - name: Test
        run: pnpm test

      - name: Package exports (publint, attw)
        run: pnpm --filter signoff-ui lint:package

  # Only on a push to main: a run started by hand gets the dry-run job below instead.
  release:
    name: Version or publish
    needs: validate
    if: github.repository == 'dgesteves/signoff-ui' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the tag and the GitHub release, and the version commit without the App
      pull-requests: write # the version pull request, without the App
      id-token: write # npm trusted publishing, with provenance
      actions: write # starting CI on the version pull request, without the App
    env:
      # 'true' once both of the release App's secrets are set; their values stay out of the env.
      HAS_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # main only accepts a pull request whose CI passed, and a push made with this workflow's own
      # token starts no workflows: the version pull request's CI waited for approval, and each one
      # needed an empty commit by hand. A push made with a GitHub App's token starts them, so with
      # the App the version pull request runs CI as any other does. Without the App's secrets, the
      # job uses its own token, as before.
      - name: Get a token from the release GitHub App
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # changesets/action pushes through the GitHub API with the token it is given, so the checkout
      # keeps no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # No registry-url and no token: npm trusted publishing authenticates this workflow with
      # OIDC, so there is no secret to leak or rotate. No pnpm store cache either: CI and the
      # validate job, which run the dependencies' build and test code, save one, and this job would
      # restore it next to the OIDC token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # With pending changesets, changesets/action switches to changeset-release/main and versions
      # the package there, so package.json then holds the next version, not main's.
      - name: Read the version on main
        id: main
        run: echo "version=$(node -p "require('./packages/signoff-ui/package.json').version")" >> "$GITHUB_OUTPUT"

      # Opens or updates a "Version packages" pull request from pending changesets; once that is
      # merged, publishes to npm and creates the tag and the GitHub release. `version-packages` also
      # moves the examples that ask for a version range of signoff-ui to the version it publishes
      # (scripts/example-versions.mjs). The action runs these without a shell, so each must be one
      # command: put `&&` in a package.json script.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

      # With pending changesets, the version in package.json is the last release: npm has it, or it
      # was tagged moments ago. If neither, the run for the version pull request's merge was
      # replaced by this one before it started, and that version was never published: this step
      # fails and names it. Re-run that run (RELEASING.md). It comes right after changesets/action,
      # so no other step's failure can skip it, and when it fails the steps after it don't run: the
      # next version pull request never merges by itself over a version npm doesn't have.
      - name: The version on main is on npm
        if: steps.changesets.outputs.has-changesets == 'true'
        run: node scripts/check-published.mjs npm
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.main.outputs.version }}

      # Without the App only. Its checks show on the version commit, but GitHub doesn't count them for
      # the pull request: approve its waiting CI run, or push an empty commit (RELEASING.md).
      - name: Run CI on the version pull request
        if: steps.changesets.outputs.has-changesets == 'true' && steps.app-token.outputs.token == ''
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}

      # Off unless the repository variable RELEASE_AUTO_MERGE is 'true' and the App is set up: then
      # each version pull request merges, and so publishes, as soon as its CI passes. Skipped when
      # the check above fails.
      - name: Merge the version pull request once its CI passes
        if: steps.changesets.outputs.pr-number != '' && steps.app-token.outputs.token != '' && vars.RELEASE_AUTO_MERGE == 'true'
        run: gh pr merge "$PR" --auto --merge --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.changesets.outputs.pr-number }}

      # With no pending changesets, signoff-ui@<version in package.json> gets its tag and GitHub
      # release, with its CHANGELOG.md entry, if npm has it and they are missing: after a publish
      # whose tag or release failed, on a re-run (which publishes nothing new), or on the next push.
      # The tag goes on the commit the version was published from: this run's, or the one npm's
      # provenance for it names.
      - name: Create the tag and the GitHub release, if they are missing
        if: ${{ !cancelled() && steps.changesets.outputs.has-changesets == 'false' }}
        run: node scripts/check-published.mjs release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.main.outputs.version }}
          # What this run published, as changesets/action lists it ([{ "name", "version" }]).
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}

  # A run started by hand, in place of the release job, and with read permissions only: what the
  # release job would do, kept in this runner. The version commit and the tarball stay here.
  dry-run:
    name: 'Dry run: version and pack, without pushing or publishing'
    needs: validate
    if: github.repository == 'dgesteves/signoff-ui' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # @changesets/changelog-github reads each changeset's pull request
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # With the App's secrets set, a token that can only read, so the dry run shows that the App
      # is installed and its secrets work before a release needs them.
      - name: Get a read-only token from the release GitHub App
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # What the release job would check or create after changesets/action, read-only: with pending
      # changesets, that npm has the version on main; with none, the tag and the GitHub release that
      # version would get.
      - name: 'Dry run: npm, the tag and the GitHub release'
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            echo 'Pending changesets: the release job would open or update the version pull request.'
            node scripts/check-published.mjs npm
          else
            echo "No pending changesets: the release job would publish what npm doesn't have yet."
            node scripts/check-published.mjs release --dry-run
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # `changeset version` exits with 1 when there is no changeset to version.
      - name: 'Dry run: version the package as the version pull request would, without pushing'
        env:
          # @changesets/changelog-github reads each changeset's commit and pull request with it.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            pnpm version-packages
            git status --short
            git diff
          else
            echo 'No pending changesets: nothing to version.'
          fi

      - name: 'Dry run: pack the package as changeset publish would, without publishing'
        run: |
          pnpm build:lib
          pnpm --filter signoff-ui pack --pack-destination "$RUNNER_TEMP/pack"
          for tarball in "$RUNNER_TEMP"/pack/*.tgz; do
            tar -xOzf "$tarball" package/package.json | jq -c '{ name, version }'
            tar -tzf "$tarball" | wc -l | xargs echo files:
          done
